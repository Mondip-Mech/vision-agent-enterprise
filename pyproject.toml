[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "__pycache__", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "UP007",  # X | Y union syntax (keep py3.9 compat)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]  # redefinition of unused name (common in pytest fixtures)

[tool.mypy]
python_version = "3.11"
warn_return_any = false
ignore_missing_imports = true
exclude = ["tests/", ".venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
